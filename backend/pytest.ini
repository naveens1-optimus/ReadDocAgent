[pytest]
# `src` on the import path so tests import the same way the app does
# (e.g. `from domain.schema.settings import Settings`) with no sys.path
# juggling in individual test modules.
pythonpath = src
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Keep asyncio tests explicit; the graph and API layers add them from M08.
asyncio_mode = strict

addopts =
    --strict-markers
    --strict-config
    -ra

markers =
    integration: hits live Azure services; requires real credentials in .env
    slow: noticeably slow test
