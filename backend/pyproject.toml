[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-int-agent-system"
version = "0.1.0"
description = "Multi-agent Intelligent Document Processing pipeline on LangGraph and Azure AI"
requires-python = ">=3.11"
readme = "../README.md"

# The canonical dependency list. src/requirements.txt mirrors this for
# `pip install -r`; a test asserts the two never drift apart.
dependencies = [
    # --- Agent orchestration ---
    "langgraph==1.2.11",
    "langchain-core==1.6.1",
    # Durable checkpointer: a run paused for approval resumes on a later
    # request, so its state must outlive the process that created it.
    "langchain-azure-cosmosdb==1.0.0",

    # --- Azure OpenAI: vision classification, enrichment, summarisation ---
    "langchain-openai==1.6.0",

    # --- Observability ---
    "langsmith==0.12.1",

    # --- Azure services (key-based authentication) ---
    "azure-ai-documentintelligence==1.0.2",
    "azure-storage-blob==12.30.1",
    "azure-cosmos==4.16.4",
    "azure-core==1.41.0",

    # --- API layer ---
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "python-multipart==0.0.32",

    # --- Data modelling / configuration ---
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",

    # --- Resilience: exponential backoff for Azure calls ---
    "tenacity==9.1.4",

    # --- Document rendering (PDF page -> image for the vision classifier) ---
    "pymupdf==1.28.2",
    "pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    # SQLite checkpointer, used only by the test suite so it runs offline.
    "langgraph-checkpoint-sqlite==3.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `src` on the import path so tests import the same way the app does
# (e.g. `from domain.enum.document_type import DocumentType`).
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "integration: hits live Azure services; requires real credentials in .env",
    "slow: noticeably slow test",
]
